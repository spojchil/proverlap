services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: proverlap-postgres
    environment:
      POSTGRES_USER: proverlap
      POSTGRES_PASSWORD: proverlap
      POSTGRES_DB: proverlap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proverlap"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: proverlap-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== PRoverlap 服务 =====
  app:
    image: ghcr.io/spojchil/proverlap:latest
    build: .
    container_name: proverlap-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Docker 网络内使用服务名覆盖 localhost
      DB_URL: jdbc:postgresql://postgres:5432/proverlap
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
