name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - '**/src/**'
      - '**/pom.xml'
      - '.github/workflows/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/src/**'
      - '**/pom.xml'
      - '.github/workflows/**'
      - 'docker-compose.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 编译
        run: bash ./mvnw compile -q

      - name: 测试
        run: bash ./mvnw test
