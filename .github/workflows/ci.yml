name: CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - '**/src/**'
      - '**/pom.xml'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/src/**'
      - '**/pom.xml'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ==================== CI ====================
      - name: 编译
        run: bash ./mvnw compile -q

      - name: 测试
        run: bash ./mvnw test

      # ==================== CD（仅 main 分支）====================
      - name: 登录 GitHub Container Registry
        if: github.ref_name == 'main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取版本号
        if: github.ref_name == 'main'
        id: version
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>//;s/<\/version>//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像
        if: github.ref_name == 'main'
        run: |
          docker compose build
          docker tag ghcr.io/spojchil/proverlap:latest ghcr.io/spojchil/proverlap:${{ steps.version.outputs.version }}
          docker compose push
          docker push ghcr.io/spojchil/proverlap:${{ steps.version.outputs.version }}
